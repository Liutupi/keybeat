<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键拍 KEYBEAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Fraunces:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one dark stage. Left-aligned console on the home screen, a single word alone in the middle while playing. */
:root{
  color-scheme:dark;
  --ink:#0a0b13;
  --ink-top:#17182b;
  --dim:rgba(255,255,255,.22);
  --dim-cur:rgba(255,255,255,.5);
  --ink-2:#12131f;
  --line:rgba(255,255,255,.1);
  --text:#efecf6;
  --muted:#8d8ca6;
  --accent:#7cf0ff;
  --hot:#ff5c8a;
  --gold:#ffcf6b;
  --display:"Unbounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--ink-top) 0%,var(--ink) 55%) var(--ink);transition:background .4s,color .3s;
  color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.screen{position:relative;z-index:1;height:100%;display:none}
.screen.on{display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
kbd{font-family:var(--mono);font-size:.78em;padding:.15em .5em;border:1px solid var(--line);border-radius:5px;color:var(--text);background:rgba(255,255,255,.04)}

/* ---------- home ---------- */
#home{overflow-y:auto;padding:clamp(20px,5vw,64px);gap:clamp(24px,5vw,72px);align-items:center;justify-content:center;flex-wrap:wrap}
.brand{flex:1 1 320px;max-width:460px;display:flex;flex-direction:column;gap:22px}
.mark{font-family:var(--display);font-weight:800;font-size:clamp(44px,7.5vw,88px);line-height:.95;letter-spacing:-.02em;margin:0;text-shadow:0 0 70px color-mix(in srgb,var(--accent) 55%,transparent)}
.mark span{display:block;font-size:.3em;font-weight:400;letter-spacing:.42em;color:var(--accent);margin-top:.9em}
.lede{color:var(--muted);line-height:1.75;margin:0;max-width:34em;font-size:15px}
.start{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;
  padding:16px 28px;border-radius:999px;background:var(--text);color:var(--ink);display:flex;gap:14px;align-items:center;
  transition:transform .15s,box-shadow .15s}
.start:hover{transform:translateY(-2px);box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.start kbd{border-color:rgba(0,0,0,.25);color:var(--ink);background:rgba(0,0,0,.06)}
.best{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.best b{color:var(--text);font-weight:600}
.console{flex:1 1 360px;max-width:520px;display:flex;flex-direction:column;gap:26px}
.group h2{font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--muted);margin:0 0 12px}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);transition:border-color .15s,background .15s}
.mode i{grid-row:span 2;font-style:normal;font-family:var(--mono);color:var(--muted);align-self:center}
.mode strong{font-size:16px;font-weight:600}
.mode small{color:var(--muted);font-size:13px;line-height:1.5}
.mode[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:0 0 0 1px var(--accent),0 12px 40px -18px var(--accent)}
.mode[aria-pressed="true"] i{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted);transition:all .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.note{font-size:12px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:22px 36px}
.chip .lv{font-family:var(--mono);font-size:.72em;opacity:.6;margin-right:.5em}
.chip .sw{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.5em;vertical-align:-.02em}
.sep{width:1px;background:var(--line);margin:4px 2px}
.voice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.voice select{font:inherit;font-size:13px;color:var(--text);background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;max-width:230px}
.voice .chip{padding:6px 12px;font-size:13px}
.srcnote{font-size:12px;color:var(--muted);margin:8px 0 0;min-height:1.3em}
.chap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chap b{color:var(--text);font-weight:600;min-width:9.5em;text-align:center}
.chap .nav{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--text);line-height:1}
.chap .nav:hover{border-color:var(--accent);color:var(--accent)}
.chap .chip{padding:5px 12px;font-size:13px}

/* ---------- play ---------- */
#play{flex-direction:column;padding:clamp(16px,3vw,32px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
.hud .where{letter-spacing:.14em}
.progress{flex:1;max-width:420px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0;text-align:center}
.zh{font-size:clamp(18px,2.6vw,26px);color:var(--text);min-height:1.4em}
.word{font-family:var(--mono);font-weight:700;font-size:clamp(34px,8vw,92px);letter-spacing:.04em;line-height:1.1;white-space:nowrap;will-change:transform}
.word .ch{display:inline-block;color:var(--dim);transition:color .08s,transform .12s}
.word .ch.done{color:var(--text);text-shadow:0 0 22px var(--accent),0 0 60px var(--accent)}
.word .ch.cur{color:var(--dim-cur);border-bottom:.06em solid var(--accent)}
.word .ch.sp{width:.55em}
.word .ch.pop{transform:translateY(-.12em) scale(1.12)}
.word.shake{animation:shake .22s}
.word.out{animation:out .22s forwards}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes out{to{transform:scale(1.25);opacity:0;filter:blur(6px)}}
.ipa{font-family:var(--mono);color:var(--muted);font-size:clamp(14px,1.8vw,18px);min-height:1.4em}
.limit{width:min(420px,70vw);height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.limit b{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.lane{position:relative;width:min(420px,70vw);height:26px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.lane::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:2px;margin-left:-1px;background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent)}
.lane s{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;animation:fade .9s forwards}
@keyframes fade{to{opacity:0;transform:scale(.4)}}
.judge{font-family:var(--display);font-size:12px;letter-spacing:.3em;height:1.2em;color:var(--muted)}
.next{font-family:var(--mono);color:var(--dim);font-size:15px;min-height:1.4em;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;width:100%;margin:0 auto}
.stat{display:flex;flex-direction:column;gap:6px;align-items:center}
.stat span{font-size:11px;letter-spacing:.24em;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,30px);font-variant-numeric:tabular-nums}
#combo.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.35);color:var(--gold)}}
.mult{color:var(--gold);font-size:.55em;margin-left:.4em}
.keys{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0}
#flash.err{background:radial-gradient(circle,transparent 45%,rgba(255,92,138,.35));animation:fl .25s}
#flash.tier{background:linear-gradient(90deg,transparent,rgba(255,207,107,.28),transparent);animation:fl .45s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#edge{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;box-shadow:inset 0 0 150px 12px var(--accent)}
#banner{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:min(17vw,170px);color:transparent;-webkit-text-stroke:2px var(--gold);opacity:0;white-space:nowrap}
#banner.on{animation:banner .9s cubic-bezier(.2,.8,.2,1)}
@keyframes banner{0%{opacity:0;transform:scale(2.6);letter-spacing:.5em}22%{opacity:1}100%{opacity:0;transform:scale(.92);letter-spacing:0}}
.pop-score{position:fixed;z-index:3;font-family:var(--display);font-weight:600;font-size:24px;color:var(--gold);text-shadow:0 0 24px var(--gold);pointer-events:none;transform:translate(-50%,0);animation:rise .85s forwards}
@keyframes rise{to{transform:translate(-50%,-90px) scale(1.25);opacity:0}}
.word.glitch .ch{animation:glitch .24s}
@keyframes glitch{0%,100%{text-shadow:none}30%{text-shadow:-7px 0 var(--hot),7px 0 var(--accent)}65%{text-shadow:6px 0 var(--hot),-6px 0 var(--accent)}}
#flash.done{background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.3),transparent 55%);animation:fl .32s}
.stage{will-change:transform}
#count{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:min(34vw,280px);color:var(--text);pointer-events:none}
#count.on{display:flex}
#count b{animation:cnt .45s both}
@keyframes cnt{from{transform:scale(1.6);opacity:0}}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:4;background:var(--ink-2);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

/* ---------- result ---------- */
#result{overflow-y:auto;padding:clamp(20px,5vw,56px);align-items:center;justify-content:center}
.card{width:min(860px,100%);display:grid;grid-template-columns:auto 1fr;gap:28px 40px;align-items:center}
.rank{font-family:var(--display);font-weight:800;font-size:clamp(96px,18vw,190px);line-height:.85;color:var(--gold);text-shadow:0 0 60px color-mix(in srgb,var(--gold) 50%,transparent)}
.sum h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 6px}
.sum p{margin:0;color:var(--muted);font-size:14px}
.nums{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.num{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.num span{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.num b{font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.num b small{font-size:.5em;color:var(--muted);font-weight:400;margin-left:.3em}
.chart{grid-column:1/-1}
.chart canvas{width:100%;height:120px;display:block}
.chart p,.miss h3{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px;font-weight:500}
.miss{grid-column:1/-1}
.miss ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.miss li{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px}
.miss li b{font-family:var(--mono);color:var(--hot);margin-right:.5em}
.acts{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
.ghost{padding:14px 22px;border-radius:999px;border:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center}
@media (max-width:560px){.card{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.word.shake,.word.out,.word.glitch .ch,#combo.bump,#count b,#banner.on{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="edge"></div>
<div id="flash"></div>
<div id="banner"></div>
<div id="count"></div>
<div id="toast"></div>

<main id="home" class="screen on">
  <div class="brand">
    <h1 class="mark">键拍<span>KEYBEAT</span></h1>
    <p class="lede">跟着鼓点敲单词和短语。每一次按键都是一个音符，连击越高，音乐越满。从小学到雅思，看释义、听发音、把拼写敲进手指里。</p>
    <button class="start" id="startBtn">开始 <kbd>Enter</kbd></button>
    <div class="best" id="best"></div>
    <p class="note">需要实体键盘，建议戴耳机并切换到英文输入法。</p>
  </div>
  <div class="console">
    <div class="group">
      <h2>模式</h2>
      <div class="modes" id="modes">
        <button class="mode" data-v="rhythm"><i>1</i><strong>节奏</strong><small>一章 20 个。踩在拍点上按键得分更高，超时或敲错会断连击。</small></button>
        <button class="mode" data-v="sprint"><i>2</i><strong>竞速</strong><small>限时 45 秒，尽可能多地敲，测你的 WPM。</small></button>
        <button class="mode" data-v="dictation"><i>3</i><strong>听写</strong><small>只给发音和中文，凭记忆拼出来。</small></button>
      </div>
    </div>
    <div class="group">
      <h2>内容与难度</h2>
      <div class="chips" id="kinds" style="margin-bottom:10px">
        <button class="chip" data-v="word">单词</button>
        <button class="chip" data-v="phrase">常用短语</button>
      </div>
      <div class="chips" id="lists"></div>
      <div class="chips" id="subs" style="margin-top:10px"></div>
      <div class="chap" id="chap"></div>
    </div>
    <div class="row">
      <div class="group">
        <h2>速度</h2>
        <div class="chips" id="bpms">
          <button class="chip" data-v="90">舒缓 90</button>
          <button class="chip" data-v="110">标准 110</button>
          <button class="chip" data-v="130">极速 130</button>
        </div>
      </div>
      <div class="group">
        <h2>声音</h2>
        <div class="chips">
          <button class="chip" id="optSpeak" aria-pressed="true">朗读发音</button>
          <button class="chip" id="optMusic" aria-pressed="true">音乐与音效</button>
        </div>
        <div class="voice">
          <div class="chips" id="accents"><button class="chip" data-v="us">美音</button><button class="chip" data-v="uk">英音</button></div>
          <div class="chips" id="sources"><button class="chip" data-v="auto">词典录音优先</button><button class="chip" data-v="tts">只用系统语音</button></div>
        </div>
        <div class="voice">
          <label for="voiceSel" style="font-size:13px;color:var(--muted)">系统语音</label>
          <select id="voiceSel"></select>
          <button class="chip" id="voiceTry">试听 tiger</button>
        </div>
        <p class="srcnote" id="srcHome"></p>
      </div>
    </div>
    <div class="group">
      <h2>主题</h2>
      <div class="chips" id="themes"></div>
    </div>
  </div>
</main>

<section id="play" class="screen">
  <div class="hud">
    <span class="where" id="where"></span>
    <div class="progress"><b id="prog"></b></div>
    <span id="left"></span>
  </div>
  <div class="stage">
    <div class="zh" id="zh"></div>
    <div class="word" id="word"></div>
    <div class="ipa" id="ipa"></div>
    <div class="limit" id="limit"><b></b></div>
    <div class="lane" id="lane"></div>
    <div class="judge" id="judge"></div>
    <div class="next" id="next"></div>
  </div>
  <div class="stats">
    <div class="stat"><span>得分</span><b id="score">0</b></div>
    <div class="stat"><span>连击</span><b id="combo">0</b></div>
    <div class="stat"><span>WPM</span><b id="wpm">0</b></div>
    <div class="stat"><span>准确率</span><b id="acc">100%</b></div>
  </div>
  <div class="keys"><span><kbd>Tab</kbd> 重听发音</span><span id="hintKey"><kbd>Enter</kbd> 提示一个字母</span><span><kbd>Esc</kbd> 退出</span><span id="src"></span></div>
</section>

<section id="result" class="screen"><div class="card" id="card"></div></section>

<script>

/* ================= word banks ================= */

    (cfg.order === "chapter" ? `<button class="nav" id="chPrev" aria-label="上一章">‹</button><b>第 ${chapOf(k) + 1} / ${total} 章</b><button class="nav" id="chNext" aria-label="下一章">›</button>` : "") +
    `<button class="chip" id="chOrder" aria-pressed="${cfg.order === "random"}">全库随机</button>` + (done ? `<span>已通过 ${done} 章</span>` : "");
  if ($("chPrev")) { $("chPrev").onclick = () => stepChap(-1); $("chNext").onclick = () => stepChap(1); }
  $("chOrder").onclick = () => { cfg.order = cfg.order === "random" ? "chapter" : "random"; store.set("cfg", cfg); renderChap(); };
}
function stepChap(d){
  const k = cfg.list; if (k === "wrong" || cfg.order !== "chapter") return;
  chaps[scope(k)] = Math.max(0, Math.min(chapCount(k) - 1, chapOf(k) + d)); store.set("ch", chaps); renderChap();
}
function pick(sel, fn){ $(sel).addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; fn(b.dataset.v); renderHome(); b.blur(); }); }
pick("modes", v => cfg.mode = v); pick("lists", v => cfg.list = v); pick("bpms", v => cfg.bpm = +v);
pick("subs", v => cfg.sub = v);
pick("accents", v => { cfg.accent = v; for (const k in preAudio) delete preAudio[k]; });
pick("sources", v => { cfg.source = v; if (v === "auto") remoteFail = false; });
function renderVoices(){
  const sel = $("voiceSel"); if (!sel) return; const auto = autoVoice();
  sel.innerHTML = `<option value="">自动${auto ? "（" + auto.name + "）" : ""}</option>` + voices.map(v => `<option value="${v.name.replace(/"/g, "&quot;")}">${v.name} · ${v.lang}</option>`).join("");
  sel.value = voices.some(v => v.name === cfg.voice) ? cfg.voice : "";
}
$("voiceSel").onchange = e => { cfg.voice = e.target.value; store.set("cfg", cfg); };
$("voiceTry").onclick = () => { audioInit(); speak("tiger", true); };
pick("kinds", v => { if (v !== cfg.kind) { cfg.kind = v; cfg.list = v === "phrase" ? "p1" : "cet4"; } });
pick("themes", v => { cfg.theme = v; applyTheme(v); });
$("optSpeak").onclick = () => { cfg.speak = !cfg.speak; renderHome(); };
$("optMusic").onclick = () => { cfg.music = !cfg.music; renderHome(); };
$("startBtn").onclick = startGame;

/* ================= input ================= */
function letterOf(e){
  if (e.key === " " || e.code === "Space") return " ";
  if (e.key === "-" || e.key === "'" || e.key === ".") return e.key;
  if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) return e.key.toLowerCase();
  if (/^Key[A-Z]$/.test(e.code)) return e.code[3].toLowerCase(); // IME is on: fall back to the physical key
  return "";
}
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (G.state === "home") {
    if (e.key === "Enter" && !(document.activeElement && document.activeElement.tagName === "BUTTON")) { e.preventDefault(); startGame(); }
    else if ("123".includes(e.key) && e.key) { cfg.mode = ["rhythm","sprint","dictation"][+e.key - 1]; renderHome(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") stepChap(e.key === "ArrowLeft" ? -1 : 1);
    return;
  }
  if (G.state === "result") { if (e.key === "Enter") { e.preventDefault(); (G.primary || startGame)(); } else if (e.key === "Escape") goHome(); return; }
  if (e.key === "Escape") { goHome(); return; }
  if (G.state !== "play") { e.preventDefault(); return; }
  if (e.key === "Tab") { e.preventDefault(); speak(G.cur.w, true); return; }
  if (e.key === "Enter") { e.preventDefault(); if (G.mode === "dictation") { G.hints++; miss(true); } return; }
  if (e.repeat) return;
  const c = letterOf(e); if (!c) return;
  e.preventDefault();
  if (e.key === "Process" || e.isComposing) toast("检测到中文输入法，建议切换到英文");
  if (c === G.cur.w[G.pos].toLowerCase()) hit(); else miss(false);
});
// without audio, drive the beat from the wall clock
const _beatNow = beatNow;
beatNow = function(){ return A.ctx && A.timer ? _beatNow() : (G.state === "count" || G.state === "play" || G.state === "swap") ? (performance.now() - fakeT0) / (60000 / cfg.bpm) : performance.now() / 545; };
applyTheme(cfg.theme);
renderHome();
requestAnimationFrame(frame);
</script>
</body>
